services:
  postgres:
    image: ankane/pgvector:latest
    environment:
      POSTGRES_DB: talkblog
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:-yourpassword}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  face-service:
    build:
      context: ./talkblog-back
      dockerfile: Dockerfile.face
    ports:
      - "5000:5000"

  backend:
    build:
      context: ./talkblog-back
      dockerfile: Dockerfile
    environment:
      DB_HOST: postgres
      DB_USER: postgres
      DB_PASSWORD: ${DB_PASSWORD:-yourpassword}
      FACE_HOST: face-service
    depends_on:
      postgres:
        condition: service_healthy
      face-service:
        condition: service_started
    volumes:
      - uploads:/app/uploads

  frontend:
    build: ./talkblog-font
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  pgdata:
  uploads:
