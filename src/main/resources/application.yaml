spring:
  application:
    name: talkblog-back

  # 数据源配置
  datasource:
    url: jdbc:postgresql://localhost:5432/postgres
    username: postgres
    password: 123456
    driver-class-name: org.postgresql.Driver
    # HikariCP 连接池配置
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  # 数据库初始化
  sql:
    init:
      mode: always
      continue-on-error: true
      schema-locations: classpath:schema.sql, classpath:schema/seed_roles.sql, classpath:schema/comments_schema.sql, classpath:schema/migration_v2.sql, classpath:schema/migration_v3.sql
      data-locations: classpath:schema/seed_data.sql

# 日志配置
logging:
  # 日志级别
  level:
    # 根日志级别
    root: INFO
    # 应用包日志级别
    "[com.revy]": DEBUG
    # MyBatis 日志
    "[com.revy.talkblogback.mapper]": DEBUG
    "[org.mybatis]": DEBUG
    # SQL 日志
    "[org.apache.ibatis]": DEBUG
    "[java.sql]": DEBUG
    # 连接池日志
    "[com.zaxxer.hikari]": INFO
    # Spring 框架日志
    "[org.springframework]": INFO
    "[org.springframework.web]": DEBUG
    "[org.springframework.boot]": INFO
  # 日志文件配置
  file:
    name: logs/talkblog-back.log
  # 日志输出格式
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
  # 日志滚动策略
  logback:
    rollingpolicy:
      max-file-size: 10MB
      max-history: 30
      total-size-cap: 1GB

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: always

# 人脸识别服务配置
face:
  service:
    url: http://localhost:5000
    extract-endpoint: /extract
    health-endpoint: /health
    timeout: 30000  # 30秒超时

# 服务器配置
server:
  port: 8080
  # 压缩配置
  compression:
    enabled: true
    mime-types: application/json,application/xml,text/html,text/xml,text/plain
  # Multipart 配置
  servlet:
    multipart:
      enabled: true
      max-file-size: 5MB
      max-request-size: 20MB

# MyBatis 配置
mybatis:
  # XML 映射文件位置
  mapper-locations: classpath:/mapper/*.xml
  # 类型别名包（便于 XML 中简写类型）
  type-aliases-package: com.revy.talkblogback.pojo
  # TypeHandler 扫描路径
  type-handlers-package: com.revy.talkblogback.handler
  configuration:
    # 将下划线命名自动映射到驼峰字段，例如 user_id -> userId
    map-underscore-to-camel-case: true

# 文件上传配置
file:
  upload-dir: uploads
  comment-images-dir: comment-images