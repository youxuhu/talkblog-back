spring:
  application:
    name: talkblog-back

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:5432/talkblog
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:yourpassword}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql
      continue-on-error: true

logging:
  level:
    root: INFO
    "[com.revy]": DEBUG
    "[com.revy.talkblogback.mapper]": DEBUG
    "[org.mybatis]": DEBUG
    "[org.apache.ibatis]": DEBUG
    "[java.sql]": DEBUG
    "[com.zaxxer.hikari]": INFO
    "[org.springframework]": INFO
    "[org.springframework.web]": DEBUG
    "[org.springframework.boot]": INFO
  file:
    name: logs/talkblog-back.log
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
  logback:
    rollingpolicy:
      max-file-size: 10MB
      max-history: 30
      total-size-cap: 1GB

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: always

face:
  service:
    url: http://${FACE_HOST:localhost}:5000
    extract-endpoint: /extract
    health-endpoint: /health
    timeout: 30000

server:
  port: 8080
  compression:
    enabled: true
    mime-types: application/json,application/xml,text/html,text/xml,text/plain
  servlet:
    multipart:
      enabled: true
      max-file-size: 5MB
      max-request-size: 20MB

spring.servlet.multipart:
  enabled: true
  max-file-size: 10MB
  max-request-size: 10MB
  location: ./uploads

app:
  file:
    upload-dir: ./uploads
    max-size: 10485760
    allowed-types: image/jpeg,image/png,image/gif,image/webp,application/pdf,application/zip,application/msword,application/vnd.openxmlformats-officedocument.wordprocessingml.document,text/plain

mybatis:
  mapper-locations: classpath:/mapper/*.xml
  type-aliases-package: com.revy.talkblogback.pojo
  type-handlers-package: com.revy.talkblogback.handler
  configuration:
    map-underscore-to-camel-case: true

file:
  upload-dir: uploads
  comment-images-dir: comment-images
  blog-images-dir: blog-images
